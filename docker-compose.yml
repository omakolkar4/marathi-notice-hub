version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Database: PostgreSQL with Persistent Storage
  # --------------------------------------------------------------------------
  postgres-db:
    image: postgres:15-alpine
    container_name: marathi_notice_hub_db
    restart: always
    environment:
      POSTGRES_DB: marathi_notice_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongProdPassword2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 2. Backend: FastAPI + Marathi NLP Pipeline
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: marathi_notice_hub_backend
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://postgres:${DB_PASSWORD:-StrongProdPassword2024}@postgres-db:5432/marathi_notice_hub
      SECRET_KEY: ${SECRET_KEY:-academic_marathi_notice_hub_production_secret_key_2024}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
      NLP_CONFIDENCE_THRESHOLD: "0.30"
      REQUIRE_ADMIN_APPROVAL_FOR_FACULTY_NOTICES: "True"
    volumes:
      - notice_uploads:/app/data/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # --------------------------------------------------------------------------
  # 3. Frontend: React + NGINX SPA Reverse Proxy
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: marathi_notice_hub_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    name: marathi_notice_hub_pgdata
  notice_uploads:
    name: marathi_notice_hub_uploads
